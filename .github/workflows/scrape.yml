name: ESL Carrier Charge Scraper

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'   # 改用 3.11，兼容性更好

      - name: Install dependencies
        run: |
          pip install --upgrade pip setuptools
          pip install -r requirements.txt

      - name: Run scraper (固定 HKHKG → AEJEA)
        run: |
          python scrape_charges.py \
            --origin "HONG KONG SAR, CHINA (HKHKG)" \
            --destination "JEBEL ALI, U.A.E. (AEJEA)" \
            --cargo dry \
            --headless
        continue-on-error: true

      - name: Upload results (即使失敗都上載)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: esl-charges-result
          path: |
            result_*.html
            result_*.png
            charges_*.json
            debug_*.html
            debug_*.png
            error_*.html
            error_*.png
          retention-days: 5
          if-no-files-found: warn
