name: ESL Carrier Charge Scraper

on:
  workflow_dispatch:   # 只保留手動撳掣，唔使填任何野

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run scraper (固定 HKHKG → AEJEA)
        run: |
          python scrape_charges.py \
            --origin "HONG KONG SAR, CHINA (HKHKG)" \
            --destination "JEBEL ALI, U.A.E. (AEJEA)" \
            --cargo dry \
            --headless

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: esl-charges-result
          path: |
            result_*.html
            result_*.png
            charges_*.json
            debug_*.html
            debug_*.png
            error_*.html
            error_*.png
          retention-days: 7
          if-no-files-found: warn
